    /* Theme-independent tokens: motion, type, shape, hit targets */
    :root {
      --motion-fast: 150ms;
      --motion-base: 200ms;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
      --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      --font-code: 'Monaspace Radon', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      --text-meta: 12px;
      --text-secondary: 14px;
      --text-body: 16px;
      --text-title: 18px;
      --text-page: 24px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --hit-target: 44px;
      --vp-wide: 1280px;
      --reading-column: 720px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: var(--font-ui);
      background: var(--surface-0);
      color: var(--color-text-primary);
      font-size: var(--text-secondary);
      line-height: 1.5;
      overflow: hidden;
    }

    /* App shell: header on top, the active view fills the rest and scrolls. */
    #root {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    .app-main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* Focus: one visible ring for every control, both themes. */
    :focus {
      outline: none;
    }

    :focus-visible {
      outline: 2px solid var(--focus-color);
      outline-offset: 2px;
    }

    /* Breakpoint: narrow is below 768px; medium and wide share one layout. */
    @media (max-width: 767.98px) {
      .only-medium-up {
        display: none !important;
      }
    }

    @media (min-width: 768px) {
      .only-narrow {
        display: none !important;
      }
    }

    /* ---------- Controls ---------- */
    button,
    select,
    input {
      font-family: inherit;
      font-size: var(--text-secondary);
      color: var(--color-text-primary);
    }

    button {
      cursor: pointer;
      background: none;
      border: none;
    }

    button:disabled,
    [aria-disabled="true"] {
      cursor: not-allowed;
      opacity: 0.55;
    }

    select,
    input {
      background: var(--color-bg-input);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
    }

    select:hover:not(:disabled),
    input:hover:not(:disabled):not([readonly]) {
      border-color: var(--color-text-tertiary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: var(--text-secondary);
      font-weight: 500;
      line-height: 1.5;
      text-decoration: none;
      white-space: nowrap;
      position: relative;
      transition: transform var(--motion-fast) var(--ease-out), opacity var(--motion-fast) var(--ease-out);
    }

    .btn:active:not(:disabled):not([aria-disabled="true"]) {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--color-bg-button);
      color: var(--color-text-button);
    }

    .btn-primary:hover:not(:disabled):not([aria-disabled="true"]) {
      background: var(--color-bg-button-hover);
    }

    .btn-secondary {
      background: var(--surface-1);
      color: var(--color-text-primary);
      border: 1px solid var(--border-strong);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--surface-2);
    }

    .btn-secondary[aria-pressed="true"] {
      border-color: var(--color-accent-primary);
      color: var(--color-accent-primary);
    }

    .btn-quiet {
      background: none;
      color: var(--color-accent-primary);
      padding-left: 8px;
      padding-right: 8px;
    }

    .btn-quiet:hover {
      text-decoration: underline;
    }

    .btn-danger {
      background: var(--color-danger);
      color: #ffffff;
    }

    .btn-danger:hover {
      background: var(--color-danger-hover);
    }

    .btn-small {
      min-height: 32px;
      padding: 4px 12px;
    }

    /* Square icon button: 40px visual, 44px hit area. */
    .icon-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: var(--radius-sm);
      color: var(--color-text-secondary);
      background: none;
      border: 1px solid transparent;
    }

    .icon-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--hit-target);
      height: var(--hit-target);
      transform: translate(-50%, -50%);
    }

    .icon-btn:hover:not(:disabled):not([aria-disabled="true"]),
    .icon-btn[aria-expanded="true"] {
      background: var(--surface-2);
      color: var(--color-text-primary);
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
    }

    .icon-btn--small {
      width: 32px;
      height: 32px;
    }

    .icon-btn--small svg {
      width: 16px;
      height: 16px;
    }

    /* Tooltip: on hover and on keyboard focus, never a native title. */
    [data-tooltip] {
      position: relative;
    }

    [data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      z-index: 1200;
      transform: translateX(-50%);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      background: var(--color-text-primary);
      color: var(--surface-1);
      font-size: var(--text-meta);
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--motion-fast) var(--ease-in);
    }

    [data-tooltip-align="end"]::after {
      left: auto;
      right: 0;
      transform: none;
    }

    [data-tooltip-align="start"]::after {
      left: 0;
      transform: none;
    }

    [data-tooltip-side="top"]::after {
      top: auto;
      bottom: calc(100% + 8px);
    }

    [data-tooltip]:focus-visible::after {
      opacity: 1;
      transition-timing-function: var(--ease-out);
    }

    @media (hover: hover) {
      [data-tooltip]:hover::after {
        opacity: 1;
        transition-delay: 300ms;
        transition-timing-function: var(--ease-out);
      }
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid var(--border-strong);
      border-top-color: var(--color-accent-focus);
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ---------- Header (app chrome) ---------- */
    .header {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 24px;
      min-height: 64px;
      background: var(--surface-1);
      border-bottom: 1px solid var(--border-subtle);
      box-shadow: var(--edge-light);
      position: relative;
      z-index: 20;
    }

    .header-main {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      font-size: var(--text-title);
      font-weight: 500;
      line-height: 1.2;
      color: var(--color-text-header);
    }

    .logomark-wrap {
      position: relative;
      display: inline-flex;
    }

    .logomark {
      height: 32px;
      width: auto;
    }

    /* Live activity: the mark turns while the worker processes. */
    .logomark.spinning {
      animation: spin 1600ms linear infinite;
    }

    .queue-bubble {
      position: absolute;
      top: -8px;
      right: -8px;
      min-width: 20px;
      height: 20px;
      padding: 0 4px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-accent-primary);
      color: var(--color-text-button);
      font-size: var(--text-meta);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    /* The wordmark is the one display moment: thin Monaspace Radon. */
    .logo-text {
      font-family: var(--font-code);
      font-weight: 100;
      font-size: 22px;
      letter-spacing: -0.03em;
      color: var(--color-text-logo);
      line-height: 1.2;
    }

    .pro-trial-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--color-accent-primary);
      border-radius: var(--radius-sm);
      color: var(--color-accent-primary);
      font-size: var(--text-meta);
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
      position: relative;
    }

    .pro-trial-cta::before {
      content: '';
      position: absolute;
      inset: -6px 0;
    }

    .pro-trial-cta:hover {
      background: var(--color-type-badge-bg);
    }

    .pro-trial-cta svg {
      flex-shrink: 0;
    }

    .pro-trial-cta-full {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pro-trial-cta-short {
      display: none;
    }

    .teambrain-cta {
      display: inline-flex;
      align-items: center;
      height: 32px;
      padding: 0 12px;
      flex-shrink: 0;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      color: var(--color-text-secondary);
      font-size: var(--text-meta);
      font-weight: 500;
      white-space: nowrap;
      text-decoration: none;
    }

    .teambrain-cta:hover {
      color: var(--color-text-primary);
      background: var(--surface-2);
    }

    .status,
    .status-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .status-controls {
      gap: 4px;
    }

    .project-filter {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 8px;
    }

    .project-filter-label {
      font-size: var(--text-meta);
      font-weight: 500;
      color: var(--color-text-secondary);
    }

    .project-filter-select {
      height: 40px;
      max-width: 200px;
      padding: 0 32px 0 12px;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 12 12' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M3 4.5L6 7.5L9 4.5' stroke='%23888' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      cursor: pointer;
    }

    .header-menu {
      position: relative;
    }

    .header-menu-panel {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 1100;
      width: 288px;
      max-width: calc(100vw - 32px);
      padding: 8px;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-overlay), var(--edge-light);
      animation: fadeIn var(--motion-fast) var(--ease-out);
    }

    .header-menu-group + .header-menu-group {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
    }

    .header-menu-group .project-filter {
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      margin: 0 0 8px;
      padding: 4px 8px 8px;
    }

    .header-menu-group .project-filter-select {
      max-width: none;
      width: 100%;
      height: 44px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: var(--hit-target);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      color: var(--color-text-primary);
      font-size: var(--text-secondary);
      text-align: left;
      text-decoration: none;
    }

    .menu-item:hover {
      background: var(--surface-2);
    }

    .menu-item svg {
      flex-shrink: 0;
      color: var(--color-text-secondary);
    }

    .menu-item-text {
      flex: 1;
    }

    .menu-item-meta {
      color: var(--color-text-tertiary);
      font-size: var(--text-meta);
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 767.98px) {
      .header {
        padding: 8px 16px;
        min-height: 56px;
        gap: 8px;
      }

      .header-main {
        gap: 12px;
      }

      .header-brand {
        gap: 8px;
      }

      .logomark {
        height: 28px;
      }

      .logo-text {
        font-size: 18px;
      }

      .teambrain-cta {
        display: none;
      }

      .pro-trial-cta-full {
        display: none;
      }

      .pro-trial-cta-short {
        display: inline;
      }
    }

    /* ---------- Page layout ---------- */
    .feed,
    .session-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 32px 24px 96px;
    }

    .feed-content,
    .session-list-content {
      width: 100%;
      max-width: var(--reading-column);
      margin: 0 auto;
    }

    .page-header {
      margin-bottom: 24px;
    }

    .page-title {
      font-size: var(--text-page);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--color-text-title);
    }

    .page-description {
      margin-top: 4px;
      max-width: 65ch;
      color: var(--color-text-secondary);
      font-size: var(--text-secondary);
    }

    .view-tabs {
      display: flex;
      gap: 24px;
      margin-top: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .view-tab {
      position: relative;
      min-height: var(--hit-target);
      padding: 0;
      font-size: var(--text-secondary);
      font-weight: 500;
      color: var(--color-text-secondary);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .view-tab:hover {
      color: var(--color-text-primary);
    }

    .view-tab.active {
      color: var(--color-text-primary);
      border-bottom-color: var(--color-accent-primary);
    }

    @media (max-width: 767.98px) {
      .feed,
      .session-list {
        padding: 24px 16px 96px;
      }

      .page-title {
        font-size: 20px;
      }
    }

    /* ---------- Feed cards ---------- */
    /* Every record is an L1 surface; its type is the coloured leading edge. */
    .card {
      --card-accent: var(--color-border-observation);
      position: relative;
      margin-bottom: 16px;
      padding: 24px;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-left: 4px solid var(--card-accent);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-raised), var(--edge-light);
      line-height: 1.6;
    }

    .summary-card {
      --card-accent: var(--color-border-summary);
    }

    .prompt-card {
      --card-accent: var(--color-border-prompt);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      font-size: var(--text-meta);
      color: var(--color-text-tertiary);
    }

    .card-header-left {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 12px;
      min-width: 0;
    }

    .card-type {
      font-weight: 600;
      color: var(--color-accent-observation);
    }

    .summary-card .card-type {
      color: var(--color-accent-summary);
    }

    .prompt-card .card-type {
      color: var(--color-accent-prompt);
    }

    .card-source {
      text-transform: capitalize;
      font-weight: 500;
    }

    .source-claude {
      color: var(--color-source-claude-text);
    }

    .source-codex {
      color: var(--color-source-codex-text);
    }

    .source-cursor {
      color: var(--color-source-cursor-text);
    }

    .source-antigravity-cli {
      color: var(--color-source-antigravity-cli-text);
    }

    .card-project,
    .card-merged-badge {
      color: var(--color-text-tertiary);
    }

    .card-title {
      font-size: var(--text-title);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.01em;
      color: var(--color-text-title);
      margin-bottom: 8px;
    }

    .view-mode-toggles {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .view-mode-toggle {
      position: relative;
      height: 32px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      color: var(--color-text-secondary);
      font-size: var(--text-meta);
      font-weight: 500;
    }

    .view-mode-toggle::before {
      content: '';
      position: absolute;
      inset: -6px 0;
    }

    .view-mode-toggle:hover {
      color: var(--color-text-primary);
      border-color: var(--border-strong);
    }

    .view-mode-toggle.active {
      background: var(--color-type-badge-bg);
      border-color: var(--color-accent-primary);
      color: var(--color-accent-primary);
    }

    .card-delete-btn:hover:not([aria-disabled="true"]) {
      color: var(--color-danger);
      background: var(--color-danger-soft);
    }

    .card-delete-error {
      display: block;
      color: var(--color-danger);
      font-size: var(--text-meta);
      max-width: 40ch;
    }

    .view-mode-content {
      max-width: 72ch;
    }

    .card-subtitle,
    .facts-list,
    .narrative {
      color: var(--color-text-secondary);
      font-size: var(--text-secondary);
      line-height: 1.6;
    }

    .facts-list {
      padding-left: 20px;
    }

    .facts-list li + li {
      margin-top: 4px;
    }

    .narrative {
      max-height: 320px;
      overflow-y: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 12px;
      margin-top: 16px;
      font-size: var(--text-meta);
      line-height: 1.4;
      color: var(--color-text-tertiary);
      font-variant-numeric: tabular-nums;
    }

    .meta-details {
      flex-basis: 100%;
      display: grid;
      gap: 4px;
      margin-top: 4px;
    }

    .meta-files {
      display: flex;
      gap: 8px;
      min-width: 0;
    }

    .meta-files dt {
      flex: none;
      min-width: 72px;
      font-weight: 500;
      color: var(--color-text-secondary);
    }

    .meta-paths {
      font-family: var(--font-code);
      overflow-wrap: anywhere;
    }

    .card-content {
      margin-bottom: 8px;
      max-width: 72ch;
      font-size: var(--text-body);
      line-height: 1.6;
      color: var(--color-text-primary);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* Long prompts collapse to a line clamp behind a Show more disclosure
       (#4757) so one captured prompt cannot push the rest of the Timeline
       off screen. */
    .prompt-card .card-content-clamped {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 8;
      overflow: hidden;
    }

    .prompt-show-more {
      min-height: 32px;
      padding: 0;
      color: var(--color-accent-prompt);
    }

    .summary-card-header {
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .summary-title {
      max-width: 60ch;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.01em;
      color: var(--color-text-title);
    }

    .summary-sections {
      display: grid;
      gap: 16px;
    }

    .summary-section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .summary-section-icon {
      position: relative;
      width: auto;
      flex: none;
    }

    .summary-section-icon--investigated {
      height: 16px;
    }

    .summary-section-icon--learned {
      height: 16px;
    }

    .summary-section-icon--notes {
      height: 16px;
    }

    .summary-section-icon--completed {
      height: 16px;
    }

    .summary-section-icon--next_steps {
      height: 16px;
    }

    .summary-section-label {
      font-size: var(--text-secondary);
      font-weight: 600;
      line-height: 1.25;
      color: var(--color-text-primary);
    }

    .summary-section-content {
      margin-left: 24px;
      max-width: 68ch;
      font-size: var(--text-body);
      line-height: 1.6;
      color: var(--color-text-secondary);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .summary-card-footer {
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
    }

    @media (max-width: 767.98px) {
      .card {
        padding: 16px;
      }

      .card-header {
        align-items: flex-start;
      }

      .summary-section-content {
        margin-left: 0;
      }
    }

    /* ---------- Feed states ---------- */
    .feed-status,
    .feed-end {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 0;
      color: var(--color-text-tertiary);
      font-size: var(--text-secondary);
    }

    .feed-sentinel {
      height: 24px;
      margin: 8px 0;
    }

    .empty-state {
      padding: 40px 32px;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: var(--edge-light);
    }

    .empty-state-title {
      font-size: var(--text-title);
      font-weight: 600;
      line-height: 1.25;
      color: var(--color-text-title);
    }

    .empty-state-description {
      margin-top: 8px;
      max-width: 60ch;
      font-size: var(--text-secondary);
      line-height: 1.6;
      color: var(--color-text-secondary);
    }

    .empty-state-action {
      margin-top: 24px;
    }

    .skeleton-list {
      display: grid;
      gap: 16px;
    }

    .skeleton-card,
    .skeleton-row {
      display: grid;
      gap: 12px;
      padding: 24px;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }

    .skeleton-row {
      padding: 16px 24px;
    }

    .skeleton-line {
      display: block;
      height: 12px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      animation: skeletonPulse 1200ms ease-in-out infinite;
    }

    .skeleton-line--meta {
      width: 24%;
    }

    .skeleton-line--title {
      width: 64%;
      height: 16px;
    }

    .skeleton-line--body {
      width: 88%;
    }

    @keyframes skeletonPulse {
      50% {
        opacity: 0.5;
      }
    }

    .error-notice {
      display: grid;
      gap: 12px;
      margin: 16px 0;
      padding: 16px 24px;
      background: var(--color-danger-soft);
      border: 1px solid var(--color-danger);
      border-radius: var(--radius-md);
    }

    .error-notice-message {
      max-width: 65ch;
      color: var(--color-text-primary);
      font-size: var(--text-secondary);
    }

    .error-notice-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .error-notice--inline {
      margin: 0;
      padding: 8px 12px;
    }

    /* ---------- Overlays ---------- */
    .confirm-dialog-backdrop,
    .welcome-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--scrim);
      animation: fadeIn var(--motion-base) var(--ease-out);
      overflow-y: auto;
    }

    .confirm-dialog {
      width: 100%;
      max-width: 440px;
      padding: 24px;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-overlay), var(--edge-light);
      animation: riseIn var(--motion-base) var(--ease-out);
    }

    .confirm-dialog-title {
      font-size: var(--text-title);
      font-weight: 600;
      line-height: 1.25;
      color: var(--color-text-title);
      overflow-wrap: anywhere;
    }

    .confirm-dialog-body {
      margin-top: 8px;
      color: var(--color-text-secondary);
      font-size: var(--text-secondary);
      line-height: 1.6;
    }

    .confirm-dialog-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 24px;
    }

    .welcome-modal {
      position: relative;
      width: 100%;
      max-width: 880px;
      padding: 48px 48px 32px;
      border-radius: var(--radius-md);
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-overlay), var(--edge-light);
      animation: riseIn var(--motion-base) var(--ease-out);
    }

    .welcome-modal-dismiss {
      position: absolute;
      top: 16px;
      right: 16px;
    }

    .welcome-modal-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
      text-align: center;
    }

    .welcome-modal-logo {
      width: 88px;
      height: 88px;
      object-fit: contain;
    }

    .welcome-modal-header h2 {
      margin-top: 8px;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--color-text-title);
    }

    .welcome-modal-header p {
      font-size: var(--text-body);
      color: var(--color-text-secondary);
    }

    .welcome-modal-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .welcome-modal-feature {
      background: var(--surface-0);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }

    .welcome-modal-feature-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      height: 100%;
      padding: 24px;
      text-align: center;
    }

    .welcome-modal-feature-art {
      width: 80px;
      height: 80px;
      color: var(--color-text-tertiary);
      flex-shrink: 0;
    }

    .welcome-modal-feature-title {
      margin-top: 4px;
      font-size: var(--text-body);
      font-weight: 600;
      line-height: 1.25;
      color: var(--color-text-primary);
    }

    .welcome-modal-feature-desc {
      font-size: var(--text-secondary);
      line-height: 1.5;
      color: var(--color-text-secondary);
    }

    .welcome-modal-footer {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
      font-size: var(--text-secondary);
    }

    .welcome-modal-footer a {
      display: inline-flex;
      align-items: center;
      min-height: var(--hit-target);
      color: var(--color-accent-primary);
      font-weight: 500;
      text-decoration: none;
    }

    .welcome-modal-footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 767.98px) {
      .welcome-modal {
        padding: 48px 16px 16px;
      }

      .welcome-modal-header h2 {
        font-size: 24px;
      }

      .welcome-modal-grid {
        grid-template-columns: 1fr;
      }

      .welcome-modal-feature-inner {
        flex-direction: row;
        text-align: left;
        align-items: center;
        gap: 16px;
        padding: 16px;
      }

      .welcome-modal-feature-art {
        width: 48px;
        height: 48px;
      }
    }

    /* Floating actions */
    .scroll-to-top,
    .console-toggle-btn {
      position: fixed;
      bottom: 24px;
      z-index: 50;
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: var(--surface-1);
      border: 1px solid var(--border-strong);
      color: var(--color-text-primary);
      box-shadow: var(--shadow-overlay), var(--edge-light);
    }

    .scroll-to-top {
      right: 24px;
      animation: fadeIn var(--motion-base) var(--ease-out);
    }

    .console-toggle-btn {
      left: 24px;
      z-index: 999;
    }

    .scroll-to-top svg,
    .console-toggle-btn svg {
      width: 20px;
      height: 20px;
    }

    @media (max-width: 767.98px) {
      .scroll-to-top {
        right: 16px;
        bottom: 16px;
      }

      .console-toggle-btn {
        left: 16px;
        bottom: 16px;
      }
    }

    /* ---------- Settings page (Settings / Configuration pattern) ---------- */
    /* No bottom padding on the scroller: the sticky Save bar pins to its edge. */
    .settings-page {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 32px 24px 0;
    }

    .settings-page-inner {
      max-width: var(--vp-wide);
      margin: 0 auto;
      padding-bottom: 32px;
    }

    .settings-page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .settings-layout {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 32px;
    }

    .settings-nav {
      position: sticky;
      top: 0;
      flex: 0 0 160px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .settings-nav-item {
      min-height: var(--hit-target);
      padding: 0 12px;
      border-radius: var(--radius-sm);
      text-align: left;
      color: var(--color-text-secondary);
      font-weight: 500;
    }

    .settings-nav-item:hover {
      background: var(--surface-2);
      color: var(--color-text-primary);
    }

    .settings-form {
      flex: 1 1 400px;
      max-width: 560px;
      min-width: 0;
    }

    .settings-column {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: var(--edge-light);
      overflow: hidden;
    }

    .settings-draft-notice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      padding: 8px 8px 8px 16px;
      border: 1px solid var(--color-accent-primary);
      border-radius: var(--radius-md);
      background: var(--color-type-badge-bg);
      font-size: var(--text-secondary);
    }

    .modal-footer {
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 16px;
      padding: 16px 0;
      background: var(--surface-0);
      border-top: 1px solid var(--border-subtle);
    }

    .save-status {
      flex: 1;
      min-width: 0;
      font-size: var(--text-secondary);
      color: var(--color-text-secondary);
    }

    .save-status .success {
      color: var(--color-accent-success);
    }

    .save-status .error {
      color: var(--color-danger);
    }

    .preview-column {
      flex: 1 1 400px;
      min-width: 0;
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .preview-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .preview-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--text-meta);
      font-weight: 500;
      color: var(--color-text-secondary);
    }

    .preview-selector select {
      height: 40px;
      max-width: 200px;
    }

    .preview-content {
      height: min(640px, calc(100dvh - 240px));
      min-height: 320px;
    }

    .terminal-preview {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: var(--edge-light);
      overflow: hidden;
    }

    .terminal-preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 8px 8px 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .terminal-preview-title {
      font-size: var(--text-meta);
      font-weight: 500;
      color: var(--color-text-secondary);
    }

    .terminal-preview-status {
      padding: 16px;
      font-size: var(--text-meta);
      color: var(--color-text-secondary);
    }

    .terminal-preview-body {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    .terminal-preview-pre {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 16px;
      overflow: auto;
      font-family: var(--font-terminal);
      font-size: var(--text-meta);
      line-height: 1.6;
      color: var(--color-text-primary);
      white-space: pre;
    }

    .terminal-preview-pre--wrap {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 767.98px) {
      .settings-page {
        padding: 24px 16px 0;
      }

      .modal-footer {
        padding-left: 64px;
      }

      .settings-page-header {
        flex-direction: column;
      }

      .settings-layout {
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
      }

      .settings-nav {
        position: static;
        flex: none;
        flex-direction: row;
        flex-wrap: wrap;
      }

      .settings-form {
        flex: none;
        max-width: none;
      }

      .preview-column {
        display: none;
      }
    }

    /* ---------- Settings form ---------- */
    .settings-section-collapsible + .settings-section-collapsible {
      border-top: 1px solid var(--border-subtle);
    }

    .section-header-btn {
      width: 100%;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 24px;
      text-align: left;
    }

    .section-header-btn:hover:not(:disabled) {
      background: var(--surface-2);
    }

    .section-header-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .section-title {
      font-size: var(--text-body);
      font-weight: 600;
      line-height: 1.25;
      color: var(--color-text-primary);
    }

    .section-description {
      font-size: var(--text-meta);
      color: var(--color-text-tertiary);
    }

    .chevron-icon {
      flex-shrink: 0;
      color: var(--color-text-tertiary);
      transition: transform var(--motion-fast) var(--ease-out);
    }

    .chevron-icon.rotated {
      transform: rotate(180deg);
    }

    .section-content {
      padding: 0 24px 24px;
    }

    /* Label row (label + help button), then the control spanning the row. */
    .form-field {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 8px;
      row-gap: 4px;
      margin-bottom: 16px;
    }

    .form-field:last-child {
      margin-bottom: 0;
    }

    .form-field > :not(.form-field-label):not(.form-field-help-btn) {
      grid-column: 1 / -1;
    }

    .form-field-label {
      font-size: var(--text-secondary);
      font-weight: 500;
      color: var(--color-text-primary);
    }

    .form-field-help-btn {
      color: var(--color-text-tertiary);
    }

    .form-field-help,
    .toggle-description {
      font-size: var(--text-meta);
      line-height: 1.5;
      color: var(--color-text-secondary);
      max-width: 65ch;
    }

    .form-field-help {
      padding: 8px 12px;
      background: var(--surface-2);
      border-radius: var(--radius-sm);
    }

    .form-field input,
    .form-field select {
      width: 100%;
      height: 44px;
      font-size: var(--text-secondary);
    }

    .form-field input[readonly],
    .form-field input:disabled {
      background: var(--surface-2);
      color: var(--color-text-secondary);
    }

    .form-field--invalid input,
    .form-field--invalid select {
      border-color: var(--color-danger);
    }

    .form-field-error {
      color: var(--color-danger);
      font-size: var(--text-meta);
      font-weight: 500;
    }

    .toggle-group {
      display: flex;
      flex-direction: column;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .toggle-row:last-child {
      border-bottom: none;
    }

    .toggle-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .toggle-label {
      font-size: var(--text-secondary);
      font-weight: 500;
      color: var(--color-text-primary);
      cursor: pointer;
    }

    .toggle-switch {
      position: relative;
      flex-shrink: 0;
      width: 40px;
      height: 24px;
      padding: 0;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
    }

    .toggle-switch::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--hit-target);
      height: var(--hit-target);
      transform: translate(-50%, -50%);
    }

    .toggle-switch.on {
      background: var(--color-accent-primary);
      border-color: var(--color-accent-primary);
    }

    .toggle-switch.disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .toggle-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.07);
      transition: transform var(--motion-fast) var(--ease-out);
    }

    .toggle-switch.on .toggle-knob {
      transform: translateX(16px);
    }

    .display-subsection {
      padding: 16px 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .display-subsection:first-child {
      padding-top: 0;
    }

    .display-subsection:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .subsection-label {
      margin-bottom: 12px;
      font-size: var(--text-secondary);
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .section-content code,
    .toggle-description code {
      font-family: var(--font-code);
      font-size: var(--text-meta);
    }

    /* ---------- Console drawer (non-modal, docked) ---------- */
    .console-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      max-height: calc(100dvh - 64px);
      background: var(--surface-1);
      border-top: 1px solid var(--border-strong);
      box-shadow: var(--shadow-overlay), var(--edge-light);
      animation: riseIn var(--motion-base) var(--ease-out);
    }

    .console-resize-handle {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 12px;
      cursor: ns-resize;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .console-resize-bar {
      width: 40px;
      height: 4px;
      border-radius: 999px;
      background: var(--border-strong);
    }

    .console-resize-handle:hover .console-resize-bar,
    .console-resize-handle:focus-visible .console-resize-bar {
      background: var(--color-accent-primary);
    }

    .console-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding: 4px 16px 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .console-title {
      font-size: var(--text-secondary);
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .console-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .console-auto-refresh {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: var(--hit-target);
      margin-right: 8px;
      font-size: var(--text-meta);
      color: var(--color-text-secondary);
      cursor: pointer;
      user-select: none;
    }

    .console-auto-refresh input[type="checkbox"] {
      width: 16px;
      height: 16px;
      padding: 0;
      cursor: pointer;
      accent-color: var(--color-accent-primary);
    }

    .console-clear-btn:hover:not(:disabled) {
      color: var(--color-danger);
      background: var(--color-danger-soft);
    }

    .console-content {
      flex: 1;
      overflow: auto;
      background: var(--surface-0);
    }

    .console-logs {
      padding: 8px 16px;
      font-family: var(--font-terminal);
      font-size: var(--text-meta);
      line-height: 1.5;
      color: var(--color-text-primary);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .console-error {
      padding: 8px 16px;
      background: var(--color-danger-soft);
      border-bottom: 1px solid var(--color-danger);
      color: var(--color-text-primary);
      font-size: var(--text-meta);
    }

    .console-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 24px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .console-filter-section {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .console-filter-label {
      font-size: var(--text-meta);
      font-weight: 600;
      color: var(--color-text-secondary);
      white-space: nowrap;
    }

    .console-filter-chips,
    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
    }

    .console-filter-chip,
    .filter-chip {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 12px;
      font-size: var(--text-meta);
      font-weight: 500;
      white-space: nowrap;
      color: var(--color-text-secondary);
      background: var(--surface-1);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
    }

    .console-filter-chip::before,
    .filter-chip::before,
    .console-filter-action::before {
      content: '';
      position: absolute;
      inset: -6px 0;
    }

    .console-filter-chip:hover,
    .filter-chip:hover {
      color: var(--color-text-primary);
      border-color: var(--chip-color, var(--color-text-tertiary));
    }

    .console-filter-chip.active {
      color: var(--color-text-primary);
      background: color-mix(in srgb, var(--chip-color, var(--color-accent-primary)) 16%, var(--surface-1));
      border-color: var(--chip-color, var(--color-accent-primary));
    }

    .filter-chip.active {
      color: var(--color-accent-primary);
      background: var(--color-type-badge-bg);
      border-color: var(--color-accent-primary);
    }

    .filter-chip-count {
      color: var(--color-text-tertiary);
      font-variant-numeric: tabular-nums;
    }

    .console-filter-action {
      position: relative;
      height: 32px;
      padding: 0 8px;
      font-size: var(--text-meta);
      font-weight: 500;
      color: var(--color-accent-primary);
    }

    .console-filter-action:hover {
      text-decoration: underline;
    }

    .log-line {
      display: block;
      padding: 2px 0;
      font-family: var(--font-terminal);
      font-size: var(--text-meta);
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .log-line-raw {
      color: var(--color-text-secondary);
    }

    .log-line-empty {
      padding: 24px 0;
      color: var(--color-text-tertiary);
      text-align: center;
    }

    .log-timestamp {
      color: var(--color-text-tertiary);
    }

    .log-level,
    .log-component {
      font-weight: 500;
    }

    .log-correlation {
      color: var(--color-accent-primary);
    }

    .log-message {
      color: inherit;
    }

    @media (max-width: 767.98px) {
      .console-filters {
        flex-direction: column;
      }

      .console-header {
        padding: 4px 8px 8px 16px;
      }

      .console-auto-refresh {
        margin-right: 0;
      }
    }

    /* ---------- Sessions (activity history) ---------- */
    .session-rows {
      display: grid;
      gap: 8px;
    }

    .session-card {
      position: relative;
      padding: 16px 16px 16px 24px;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-raised), var(--edge-light);
      cursor: pointer;
    }

    .session-card:hover {
      border-color: var(--border-strong);
    }

    .session-card:hover .session-card-name {
      color: var(--color-accent-primary);
    }

    .session-card--deleting {
      opacity: 0.55;
      pointer-events: none;
    }

    .session-card .card-delete-error {
      margin-top: 8px;
      max-width: none;
      cursor: default;
    }

    .session-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .session-card-title-group {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .session-card-name {
      font-size: var(--text-body);
      font-weight: 600;
      line-height: 1.25;
      color: var(--color-text-title);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-card-count {
      flex: none;
      font-size: var(--text-meta);
      color: var(--color-text-secondary);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .session-card-actions {
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .session-card-chevron {
      color: var(--color-text-tertiary);
    }

    .session-card-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 30;
      min-width: 176px;
      padding: 4px;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-overlay), var(--edge-light);
      animation: fadeIn var(--motion-fast) var(--ease-out);
    }

    .session-card-menu-item {
      display: block;
      width: 100%;
      min-height: var(--hit-target);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      text-align: left;
      font-size: var(--text-secondary);
      color: var(--color-text-primary);
    }

    .session-card-menu-item:hover {
      background: var(--surface-2);
    }

    .session-card-menu-item--danger {
      color: var(--color-danger);
    }

    .session-card-menu-item--danger:hover {
      background: var(--color-danger-soft);
    }

    .session-card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
      margin-top: 4px;
      font-size: var(--text-meta);
      color: var(--color-text-tertiary);
      min-width: 0;
    }

    .session-card-platform {
      text-transform: capitalize;
    }

    .session-card-id,
    .session-detail-id {
      font-family: var(--font-code);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 767.98px) {
      .session-card-id {
        display: none;
      }
    }

    /* ---------- Session detail (Detail / Record) ---------- */
    .session-detail-header {
      margin: 24px 0 16px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: var(--text-secondary);
      color: var(--color-text-tertiary);
    }

    .breadcrumb-link {
      display: inline-flex;
      align-items: center;
      min-height: var(--hit-target);
      color: var(--color-accent-primary);
      font-weight: 500;
      text-decoration: none;
    }

    .breadcrumb-link:hover {
      text-decoration: underline;
    }

    .breadcrumb-current {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-detail-title-group {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .session-detail-title {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--color-text-title);
      overflow-wrap: anywhere;
    }

    .session-detail-meta {
      display: flex;
      gap: 16px;
      min-width: 0;
      font-size: var(--text-meta);
      color: var(--color-text-tertiary);
    }

    .session-detail-platform {
      flex: none;
      text-transform: capitalize;
    }

    .category-filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .category-filter-count {
      font-size: var(--text-meta);
      color: var(--color-text-tertiary);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .filter-clear {
      min-height: 32px;
    }

    /* ---------- Memory universe: the one bold moment ---------- */
    /* Every loaded memory is a star; the sky is the same deep night in both themes. */
    .universe {
      margin: 0 0 24px;
    }

    .universe-sky-frame {
      overflow: hidden;
      background:
        radial-gradient(ellipse at 80% 0%, rgba(110, 140, 220, 0.18), transparent 60%),
        var(--sky-bg);
      border: 1px solid var(--sky-border);
      border-radius: var(--radius-md);
    }

    .universe-sky {
      display: block;
    }

    .universe-constellation {
      fill: none;
      stroke: rgba(205, 214, 244, 0.2);
      stroke-width: 1;
    }

    .universe-star {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform var(--motion-fast) var(--ease-out);
    }

    .universe-star--observation {
      fill: #8cc4ff;
    }

    .universe-star--summary {
      fill: #f5c86a;
    }

    .universe-star--prompt {
      fill: #c3a8ff;
    }

    .universe-star:hover,
    .universe-star.is-active {
      transform: scale(1.8);
      stroke: #ffffff;
      stroke-width: 0.75;
    }

    .universe-caption {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 4px 16px;
      margin-top: 8px;
      font-size: var(--text-meta);
      color: var(--color-text-secondary);
    }

    .universe-focus {
      flex: 1 1 320px;
      min-width: 0;
    }

    .universe-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      font-variant-numeric: tabular-nums;
    }

    .universe-key::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 4px;
      border-radius: 50%;
    }

    .universe-key--observation::before {
      background: #4f8fd6;
    }

    .universe-key--summary::before {
      background: #d9a63c;
    }

    .universe-key--prompt::before {
      background: #9277d6;
    }

    .card:focus-visible {
      outline-offset: 4px;
    }

    /* ---------- Reduced motion: instant, or opacity only ---------- */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
        transition-delay: 0ms !important;
        scroll-behavior: auto !important;
      }

      .skeleton-line {
        animation: none !important;
      }

      .logomark.spinning {
        animation: none !important;
      }

      .spinner {
        animation: none !important;
        border-top-color: var(--border-strong);
        border-right-color: var(--color-accent-focus);
      }
    }
  </style>

</head>

</body>
